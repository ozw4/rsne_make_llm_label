# Example configuration for the reader's CODEX_HOME/config.toml. Do not use for development.
# Verify that the pinned Codex CLI version recognizes these settings.
# Explicitly specify the model and reasoning settings in the runner and keep them fixed throughout the run.
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"

# Treat only the report-reading working directory as the project root.
project_root_markers = []
project_doc_fallback_filenames = []

[features]
shell_tool = false
multi_agent = false
memories = false
plugins = false
apps = false

[tools]
view_image = false

# Do not register MCP servers, additional plugins, or shared AGENTS.md instructions in this CODEX_HOME.
# Do not copy the host's entire CODEX_HOME or skills into this environment.
